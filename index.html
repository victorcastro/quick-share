<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="The fastest way to move text between devices. Paste on your phone, open on your laptop: share plain text across Android, iOS, Windows, macOS and Linux with a short code, a link or a QR. No app, no sign-up, expires on its own."
    />
    <meta
      name="keywords"
      content="share text between devices, cross-platform clipboard, phone to computer text, send text to another device, QR text sharing, ephemeral paste"
    />
    <link rel="canonical" href="https://victorcastro.github.io/quick-share/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuickShare" />
    <meta property="og:url" content="https://victorcastro.github.io/quick-share/" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="QuickShare - the fastest way to move text between devices" />
    <meta
      property="og:description"
      content="Paste on your phone, open on your laptop. Share plain text across any device with a short code, a link or a QR. No app, no sign-up, expires on its own."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QuickShare - the fastest way to move text between devices" />
    <meta
      name="twitter:description"
      content="Paste on your phone, open on your laptop. Share plain text across any device with a short code, a link or a QR. No app, no sign-up, expires on its own."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237aa2f7'/%3E%3Cpath d='M9 12h14M9 16h14M9 20h8' stroke='%230b0c0e' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>QuickShare - the fastest way to move text between devices</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('quickshare:theme');
          if (stored !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="px-4 pt-8 pb-10 text-body sm:px-5">
    <main class="mx-auto flex w-full max-w-[620px] flex-col gap-8 lg:max-w-[980px] sm:min-h-[calc(100vh-4.5rem)]">
      <header class="flex items-center justify-between gap-3">
        <div class="w-1/3 min-w-0 text-left sm:w-auto">
          <h1 class="text-lg font-semibold tracking-tight sm:text-2xl">QuickShare</h1>
          <p class="mt-0.5 text-xs text-muted sm:text-sm">
            <span class="sm:hidden">Text across devices</span>
            <span class="hidden sm:inline">The fastest way to move text between devices</span>
          </p>
        </div>

        <div id="lookup-field" class="relative w-2/3 shrink-0 sm:w-56">
          <label class="sr-only" for="lookup">Code</label>
          <input
            id="lookup"
            class="peer relative z-10 h-12 w-full border-0 bg-transparent pr-10 pl-0.5 text-center font-mono text-xl font-medium tracking-wide outline-none"
            type="text"
            placeholder="code?"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
          />
          <div
            id="lookup-line"
            class="pointer-events-none absolute right-10 bottom-0 left-0 border-b-2 border-border-subtle transition-colors peer-focus:border-accent"
          ></div>
          <button
            id="lookup-paste"
            class="group absolute top-1/2 right-12 z-20 flex size-7 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
            type="button"
            aria-label="Paste code"
          >
            <i data-lucide="clipboard" class="size-4" aria-hidden="true"></i>
            <span
              class="pointer-events-none absolute top-full left-1/2 z-20 mt-1.5 -translate-x-1/2 rounded-full bg-text px-2 py-1 text-xs whitespace-nowrap text-bg opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
              aria-hidden="true"
            >
              Paste
            </span>
          </button>
          <button
            id="lookup-clear"
            class="absolute top-1/2 right-12 z-20 flex size-7 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
            type="button"
            aria-label="Clear code"
            title="Clear code"
            hidden
          >
            <i data-lucide="x" class="size-4" aria-hidden="true"></i>
          </button>
          <button
            id="read"
            class="absolute top-1/2 right-1 z-20 flex size-9 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-accent text-accent-ink transition-colors hover:bg-accent-strong focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
            type="button"
            disabled
            hidden
            aria-label="Open snip"
            title="Open snip"
          >
            <i data-lucide="arrow-right" class="size-4" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="flex flex-col justify-center gap-4 sm:flex-1">
        <p
          id="error"
          class="alert rounded-2xl border border-danger-border bg-danger-bg px-3 py-2.5 text-sm text-danger"
          role="alert"
        ></p>

        <section class="flex flex-col gap-3">
          <div class="flex flex-col items-end gap-2">
          <div class="flex w-full flex-col items-center gap-2 sm:flex-row sm:items-center sm:gap-3">
            <p
              id="action-message"
              class="w-full shrink-0 text-center text-sm text-muted sm:min-w-0 sm:flex-1 sm:text-right"
              role="status"
              aria-live="polite"
            ></p>
              <div class="flex shrink-0 items-center justify-center gap-2 sm:justify-end">
              <button
                id="theme-toggle"
                type="button"
                class="flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
                hidden
                aria-label="Switch theme"
              >
                <i data-lucide="sun" class="size-4 dark:hidden" aria-hidden="true"></i>
                <i data-lucide="moon" class="hidden size-4 dark:block" aria-hidden="true"></i>
              </button>

              <div id="new-link-action" class="relative" hidden>
                <button
                  id="new-link"
                  type="button"
                  class="group relative flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-border-subtle bg-surface text-muted transition-colors hover:border-border-strong hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
                  aria-label="Create new link"
                  aria-haspopup="dialog"
                  aria-expanded="false"
                >
                  <i data-lucide="file-plus-2" data-icon class="size-4" aria-hidden="true"></i>
                  <i data-lucide="loader-circle" data-spinner class="size-4 animate-spin" aria-hidden="true"></i>
                  <span
                    class="pointer-events-none absolute bottom-full left-1/2 z-20 mb-1.5 -translate-x-1/2 rounded-full bg-text px-2 py-1 text-xs whitespace-nowrap text-bg opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
                    aria-hidden="true"
                  >
                    New link
                  </span>
                </button>
                <div
                  id="new-link-confirm"
                  class="absolute top-full right-0 z-30 mt-2 w-64 rounded-2xl border border-border-subtle bg-surface p-3 shadow-lg"
                  role="dialog"
                  aria-label="Confirm new link"
                  hidden
                >
                  <p class="text-sm text-text">Create a new link and stop updating the current one?</p>
                  <div class="mt-3 flex justify-end gap-2">
                    <button
                      id="new-link-cancel"
                      type="button"
                      class="cursor-pointer rounded-full px-3 py-1.5 text-xs text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
                    >
                      Cancel
                    </button>
                    <button
                      id="new-link-confirm-button"
                      type="button"
                      class="cursor-pointer rounded-full bg-accent px-3 py-1.5 text-xs font-medium text-accent-ink transition-colors hover:bg-accent-strong focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
                    >
                      New link
                    </button>
                  </div>
                </div>
              </div>

              <div class="relative">
                <button
                  id="copy"
                  type="button"
                  class="group flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-border-subtle bg-surface text-muted transition-colors hover:border-border-strong hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
                  aria-label="Copy share link"
                >
                  <i data-lucide="link" data-icon class="size-4" aria-hidden="true"></i>
                  <i data-lucide="check" data-success class="size-4" aria-hidden="true"></i>
                  <i data-lucide="loader-circle" data-spinner class="size-4 animate-spin" aria-hidden="true"></i>
                  <span
                    class="pointer-events-none absolute bottom-full left-1/2 z-20 mb-1.5 -translate-x-1/2 rounded-full bg-text px-2 py-1 text-xs whitespace-nowrap text-bg opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
                    aria-hidden="true"
                  >
                    Share link
                  </span>
                </button>
              </div>

              <div class="relative">
                <button
                  id="qr-toggle"
                  type="button"
                  class="group flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-border-subtle bg-surface text-muted transition-colors hover:border-border-strong hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
                  aria-label="Show QR code"
                >
                  <i data-lucide="qr-code" data-icon class="size-4" aria-hidden="true"></i>
                  <i data-lucide="check" data-success class="size-4" aria-hidden="true"></i>
                  <i data-lucide="loader-circle" data-spinner class="size-4 animate-spin" aria-hidden="true"></i>
                  <span
                    class="pointer-events-none absolute bottom-full left-1/2 z-20 mb-1.5 -translate-x-1/2 rounded-full bg-text px-2 py-1 text-xs whitespace-nowrap text-bg opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
                    aria-hidden="true"
                  >
                    Show QR
                  </span>
                </button>
                <div
                  id="qr-popover"
                  class="absolute top-full right-0 z-20 mt-2 w-[170px] rounded-2xl border border-border-subtle bg-surface p-3 shadow-lg"
                  hidden
                >
                  <div id="result-qr" class="qr"></div>
                  <button
                    id="copy-qr-image"
                    type="button"
                    class="mt-2 w-full cursor-pointer rounded-full px-3 py-1.5 text-xs font-medium text-muted transition-colors hover:bg-surface-2 hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-wait disabled:opacity-50"
                    disabled
                  >
                    Copy QR image
                  </button>
                </div>
              </div>
            </div>
            </div>
            <p id="result-countdown" class="countdown text-right"></p>
          </div>

          <div class="relative">
            <div class="relative z-10 rounded-2xl bg-surface-2">
            <textarea
              id="content"
              class="block min-h-[300px] w-full resize-none overflow-hidden rounded-2xl border-0 bg-transparent px-5 pt-4 pb-3 font-mono text-sm leading-relaxed outline-none transition-shadow"
              rows="13"
              spellcheck="false"
            ></textarea>
            <footer
              id="content-actions"
              class="flex items-center gap-2 border-t border-border-subtle px-4 py-3"
              role="group"
              aria-label="Content actions"
              hidden
            >
            <p
              id="content-limit"
              class="hidden shrink-0 text-xs text-muted tabular-nums sm:block"
            ></p>
            <p
              id="content-action-message"
              class="min-w-0 flex-1 text-right text-xs text-muted"
              role="status"
              aria-live="polite"
            ></p>
            <button
              id="copy-content"
              type="button"
              aria-label="Copy content"
              class="flex cursor-pointer items-center gap-2 rounded-full border border-border-subtle bg-surface px-2 py-1.5 text-xs font-medium text-muted transition-colors hover:border-border-strong hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50 sm:px-3"
              disabled
            >
              <i data-lucide="copy" data-icon class="size-3.5" aria-hidden="true"></i>
              <i data-lucide="check" data-success class="size-3.5" aria-hidden="true"></i>
              <span class="hidden sm:inline">Copy</span>
            </button>
            <button
              id="download-content"
              type="button"
              aria-label="Download content"
              class="flex cursor-pointer items-center gap-2 rounded-full px-2 py-1.5 text-xs font-medium text-muted transition-colors hover:bg-surface-2 hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50 sm:px-3"
              disabled
            >
              <i data-lucide="download" class="size-3.5" aria-hidden="true"></i>
              <span class="hidden sm:inline">Download</span>
            </button>
            <div class="relative">
              <button
                id="clear-content"
                type="button"
                aria-label="Clear content"
                class="flex cursor-pointer items-center gap-2 rounded-full px-2 py-1.5 text-xs font-medium text-muted transition-colors hover:bg-surface-2 hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50 sm:px-3"
                aria-haspopup="dialog"
                aria-expanded="false"
                disabled
              >
                <i data-lucide="eraser" class="size-3.5" aria-hidden="true"></i>
                <span class="hidden sm:inline">Clear</span>
              </button>
              <div
                id="clear-content-confirm"
                class="absolute right-0 bottom-full z-30 mb-2 w-64 rounded-2xl border border-border-subtle bg-surface p-3 shadow-lg"
                role="dialog"
                aria-label="Confirm clearing content"
                hidden
              >
                <p class="text-sm text-text">Clear the current content?</p>
                <div class="mt-3 flex justify-end gap-2">
                  <button
                    id="clear-content-cancel"
                    type="button"
                    class="cursor-pointer rounded-full px-3 py-1.5 text-xs text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
                  >
                    Cancel
                  </button>
                  <button
                    id="clear-content-confirm-button"
                    type="button"
                    class="cursor-pointer rounded-full bg-accent px-3 py-1.5 text-xs font-medium text-accent-ink transition-colors hover:bg-accent-strong focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
                  >
                    Clear
                  </button>
                </div>
              </div>
            </div>
            </footer>
            </div>
          </div>
        </section>
      </div>

      <footer class="flex justify-center text-xs text-muted">
        <a
          class="inline-flex items-center gap-2 rounded-full px-3 py-1.5 opacity-70 transition-[color,opacity] hover:text-text hover:opacity-100 focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          href="https://github.com/victorcastro/quick-share"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="size-3.5" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
          </svg>
          <span>Source code</span>
          <span aria-hidden="true">&middot;</span>
          <span class="font-mono">v%APP_VERSION%</span>
        </a>
      </footer>
    </main>

    <aside
      id="history"
      class="pointer-events-none fixed inset-x-3 bottom-3 z-40 flex max-h-[45vh] flex-col items-end gap-2 sm:inset-x-auto sm:right-4 sm:bottom-4 sm:max-h-[60vh] sm:w-72"
      aria-label="Recent snips"
    >
      <ul id="history-list" class="flex w-full flex-col gap-2 overflow-y-auto p-1" hidden></ul>
      <button
        id="history-toggle"
        type="button"
        class="pointer-events-auto flex cursor-pointer items-center gap-2 rounded-full border border-border-subtle bg-surface px-3 py-1.5 text-xs font-medium text-muted shadow-lg transition-colors hover:border-border-strong hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        aria-controls="history-list"
        aria-expanded="false"
      >
        <i data-lucide="history" class="size-3.5" aria-hidden="true"></i>
        <span id="history-toggle-label">Show recent</span>
        <span
          id="history-count"
          class="rounded-full bg-surface-2 px-1.5 py-0.5 font-mono text-[0.625rem] text-text tabular-nums"
        ></span>
      </button>
    </aside>

    <template id="history-card">
      <li
        class="history-card pointer-events-auto rounded-2xl border border-border-subtle bg-surface p-3 shadow-lg"
      >
        <div class="flex items-center gap-1.5">
          <span data-code class="min-w-0 flex-1 truncate font-mono text-sm font-semibold"></span>
          <button
            data-copy
            type="button"
            class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
            aria-label="Copy code"
            title="Copy code"
          >
            <i data-lucide="copy" data-icon class="size-3.5" aria-hidden="true"></i>
            <i data-lucide="check" data-success class="size-3.5" aria-hidden="true"></i>
          </button>
          <button
            data-share
            type="button"
            class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
            aria-label="Share link"
            title="Share link"
          >
            <i data-lucide="share-2" data-icon class="size-3.5" aria-hidden="true"></i>
            <i data-lucide="check" data-success class="size-3.5" aria-hidden="true"></i>
          </button>
          <button
            data-qr
            type="button"
            class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
            aria-label="Show QR code"
            title="Show QR code"
            aria-expanded="false"
          >
            <i data-lucide="qr-code" class="size-3.5" aria-hidden="true"></i>
          </button>
          <button
            data-dismiss
            type="button"
            class="flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
            aria-label="Remove from history"
            title="Remove from history"
          >
            <i data-lucide="x" class="size-3.5" aria-hidden="true"></i>
          </button>
        </div>
        <p data-remaining class="countdown mt-1"></p>
        <div data-qr-panel class="qr mt-3 flex justify-center" hidden></div>
      </li>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
