<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Ephemeral plain-text sharing. Paste text, get a short code, share it." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237aa2f7'/%3E%3Cpath d='M9 12h14M9 16h14M9 20h8' stroke='%230b0c0e' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>QuickSnip</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('quicksnip:theme');
          if (stored !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="px-4 pt-8 pb-10 text-body sm:px-5">
    <main class="mx-auto flex w-full max-w-[620px] flex-col gap-4 lg:max-w-[980px] sm:min-h-[calc(100vh-4.5rem)]">
      <header class="grid grid-cols-[1fr_auto] items-center gap-x-4 gap-y-3 sm:grid-cols-[1fr_auto_1fr]">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">QuickSnip</h1>
          <p class="mt-0.5 text-sm text-muted">Paste & Share</p>
        </div>

        <div class="flex items-center justify-end gap-2 sm:order-3">
          <button
            id="theme-toggle"
            type="button"
            class="flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
            aria-label="Switch theme"
          >
            <svg
              class="size-4 dark:hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <svg
              class="hidden size-4 dark:block"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
              />
            </svg>
          </button>

          <div class="relative">
            <button
              id="copy"
              type="button"
              class="flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-border-subtle bg-surface text-muted transition-colors hover:border-border-strong hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
              aria-label="Copy share link"
              title="Copy share link"
            >
              <svg
                class="size-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
            </button>
            <span
              id="copy-feedback"
              class="pointer-events-none absolute top-full left-1/2 mt-1.5 -translate-x-1/2 rounded-full bg-text px-2 py-1 text-xs whitespace-nowrap text-bg opacity-0 transition-opacity"
            >
              Copied
            </span>
          </div>

          <div class="relative">
            <button
              id="qr-toggle"
              type="button"
              class="flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-border-subtle bg-surface text-muted transition-colors hover:border-border-strong hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
              aria-label="Show QR code"
              title="Show QR code"
            >
              <svg
                class="size-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect width="5" height="5" x="3" y="3" rx="1" />
                <rect width="5" height="5" x="16" y="3" rx="1" />
                <rect width="5" height="5" x="3" y="16" rx="1" />
                <path d="M21 16h-3a2 2 0 0 0-2 2v3" />
                <path d="M21 21v.01" />
                <path d="M12 7v3a2 2 0 0 1-2 2H7" />
                <path d="M3 12h.01" />
                <path d="M12 3h.01" />
                <path d="M12 16v.01" />
                <path d="M16 12h1" />
                <path d="M21 12v.01" />
                <path d="M12 21v-1" />
              </svg>
            </button>
            <div
              id="qr-popover"
              class="absolute top-full right-0 z-10 mt-2 w-[150px] rounded-2xl border border-border-subtle bg-surface p-3 shadow-lg"
              hidden
            >
              <div id="result-qr" class="qr"></div>
            </div>
          </div>
        </div>

        <div class="col-span-2 flex flex-col gap-1 sm:order-2 sm:col-span-1">
          <div id="lookup-field" class="relative w-full sm:w-44">
            <label class="sr-only" for="lookup">Code</label>
            <input
              id="lookup"
              class="h-10 w-full rounded-2xl border border-border-subtle bg-surface pr-16 pl-3 font-mono text-sm tracking-wider outline-none transition-[border-color,box-shadow]"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
            />
            <button
              id="lookup-clear"
              class="absolute top-1/2 right-10 flex size-6 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
              type="button"
              aria-label="Clear code"
              title="Clear code"
              hidden
            >
              <svg
                class="size-3.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
            <button
              id="read"
              class="absolute top-1/2 right-1 flex size-8 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-accent text-accent-ink transition-colors hover:bg-accent-strong focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
              type="button"
              disabled
              aria-label="Open snip"
              title="Open snip"
            >
              <svg
                class="size-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </button>
          </div>

          <p id="result-countdown" class="countdown text-right"></p>
        </div>
      </header>

      <div class="flex flex-col justify-center gap-4 sm:flex-1">
        <p
          id="error"
          class="alert rounded-2xl border border-danger-border bg-danger-bg px-3 py-2.5 text-sm text-danger"
          role="alert"
        ></p>

        <section class="flex flex-col gap-3">
          <div class="relative">
            <div class="content-glow hidden sm:block" aria-hidden="true"></div>
            <textarea
              id="content"
              class="relative z-10 min-h-[300px] w-full resize-none overflow-hidden rounded-2xl border border-border-subtle bg-surface-2 px-3 py-2.5 font-mono text-sm leading-relaxed outline-none transition-[border-color,box-shadow]"
              rows="13"
              spellcheck="false"
            ></textarea>
          </div>
          <p id="content-limit" class="text-xs text-danger" hidden></p>
        </section>
      </div>

      <footer class="text-center text-xs text-muted"></footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
